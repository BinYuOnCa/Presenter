<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>OCHC Worship</title>
<!--
  投影舞台页（版式与 OCHC_Worship_init.html 相同）。
  时间切换由 Presenter 控制（config.json）：
    时钟阶段：日期 + 时间（带秒）
    倒计时阶段：“离崇拜开始还有：” + MM:SS
    倒计时结束：“敬拜马上开始!”（随即被 PDF 盖住；PDF 缺失时会一直显示这句）
  Logo：放在 images/LogoNew.png（或与本文件同一文件夹的 LogoNew.png）。
  预览：浏览器直接打开；加 ?mode=countdown&s=90 预览倒计时，?mode=final 预览结束语。
-->
<style>
/* 页面底色：原文件是透明背景（浏览器里显示为白色），投影上用白色。想换颜色改这里 */
:root{
    --page-bg:#ffffff;
}
html{
    background:var(--page-bg);
}
body{
    margin:0;
    background:var(--page-bg);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial;
    color:white;
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    cursor:none;
}

/* 左上角 Logo */
#logo{
    position:absolute;
    top:0;
    left:0;
    width:25%;  /* 1/4 宽 */
    height:50%; /* 1/2 高 */
    object-fit:contain;
}

/* 右上角两行大字 */
#topRightText{
    position:absolute;
    top:0;
    right:0;
    width:66.666%;  /* 2/3 宽 */
    height:25%;     /* 1/4 高 */
    text-align:left;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding-left:1vw;
}
#topRightText div{
    font-size:7vw;
    font-weight:bold;
    color:blue;
}

/* 左下角两行大字 */
#bottomLeftText{
    position:absolute;
    bottom:0;
    left:0;
    width:67%;  /* 2/3 宽 */
    height:25%;     /* 1/4 高 */
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding-left:1vw;
}
#bottomLeftText div{
    font-size:4.5vw;
    font-weight:bold;
    color:blue;
}

/* 右下角两行小字 */
#bottomRightText{
    position:absolute;
    bottom:0;
    right:0;
    width:36%;  /* 1/3 宽 */
    height:20%; /* 1/6 高 */
    display:flex;
    flex-direction:column;
    justify-content:center;
    text-align:center;
}
#bottomRightText div{
    font-size:3vw;
    font-weight:bold;
    color:blue;
}

/* 中间动态内容 */
#centerContainer{
    position:absolute;
    top:45%;
    left:55%;
    transform:translate(-50%, -50%);
    text-align:center;
    opacity:1;
    transition: opacity 0.5s ease-in-out;
}

#date{
    font-size:5vw;
    opacity:.95;
    color:blue;
}

#time{
    font-size:6vw;
    font-weight:600;
    color:blue;
    font-variant-numeric:tabular-nums;
}

#countdown{
    font-size:7vw;
    font-weight:670;
    color:blue;
    font-variant-numeric:tabular-nums;
}
</style>
</head>

<body>

<!-- 背景固定内容 -->
<img id="logo" src="images/LogoNew.png" alt=""
     onerror="if(!this.dataset.retry){this.dataset.retry='1';this.src='LogoNew.png';}else{this.style.visibility='hidden';}">

<div id="topRightText">
    <div id="topLine1">请安静...</div>
    <div id="topLine2">以心灵诚实敬拜神</div>
</div>

<div id="bottomLeftText">
    <div id="bottomLine1">请勿吃零食或饮料（饮水除外）</div>
    <div id="bottomLine2">请保持安静，并关闭手机</div>
</div>

<div id="bottomRightText">
    <div id="bottomRightLine1">橡城华人希望教会</div>
    <div id="bottomRightLine2">www.ochopechurch.org</div>
</div>

<!-- 中间动态内容 -->
<div id="centerContainer">
    <div id="date"></div>
    <div id="time"></div>
    <div id="countdown"></div>
</div>

<script>
(function () {
    // -------- 文字设置 --------
    var COUNTDOWN_LABEL = "离崇拜开始还有：";   // 倒计时阶段，日期行显示的文字
    var FINAL_TEXT = "敬拜马上开始!";          // 倒计时结束后显示的固定内容
    // --------------------------

    var dateEl = document.getElementById("date");
    var timeEl = document.getElementById("time");
    var countdownEl = document.getElementById("countdown");

    var mode = "clock", target = 0;

    function p2(n) { return (n < 10 ? "0" : "") + n; }

    function setText(el, text) { if (el.textContent !== text) el.textContent = text; }
    function setShown(el, shown) {
        var v = shown ? "block" : "none";
        if (el.style.display !== v) el.style.display = v;
    }

    function render() {
        var now = new Date();
        if (mode === "countdown") {
            var left = Math.ceil((target - now.getTime()) / 1000);
            if (left > 0) {
                // 倒计时阶段
                setShown(dateEl, true); setShown(timeEl, false); setShown(countdownEl, true);
                setText(dateEl, COUNTDOWN_LABEL);
                setText(countdownEl, p2(Math.floor(left / 60)) + ":" + p2(left % 60));
            } else {
                // 倒计时结束
                setShown(dateEl, false); setShown(timeEl, false); setShown(countdownEl, true);
                setText(countdownEl, FINAL_TEXT);
            }
        } else {
            // 初始状态：显示日期和时间
            setShown(dateEl, true); setShown(timeEl, true); setShown(countdownEl, false);
            setText(dateEl, now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日");
            setText(timeEl, p2(now.getHours()) + ":" + p2(now.getMinutes()) + ":" + p2(now.getSeconds()));
        }
    }

    // Presenter 调用：setMode('clock') / setMode('countdown', 结束时刻的毫秒时间戳)
    window.setMode = function (m, t) {
        mode = (m === "countdown") ? "countdown" : "clock";
        target = Number(t) || 0;
        render();
    };

    // 浏览器单独打开时的预览
    var q = new URLSearchParams(location.search);
    if (q.get("mode") === "countdown") {
        window.setMode("countdown", Date.now() + (Number(q.get("s")) || 90) * 1000);
    } else if (q.get("mode") === "final") {
        window.setMode("countdown", Date.now() - 1000);
    } else {
        window.setMode("clock", 0);
    }
    setInterval(render, 50);
})();
</script>

</body>
</html>
